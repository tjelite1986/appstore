name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    # The lockfile is generated on an arm64 Pi; an arm runner resolves the same native deps.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
